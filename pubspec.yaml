name: tsukin_taimaroku
description: 通勤退魔録 — Phase 1 手触り検証プロトタイプ
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # 日本語を含む全文字をこのフォントで描く。Web では外部フォント取得に頼らない。
  fonts:
    - family: DotGothic16
      fonts:
        - asset: assets/fonts/DotGothic16-Regular.ttf
